media:
  - name: images
    label: Website Images
    input: images
    output: images
    categories:
      - image
    rename: safe

  - name: documents
    label: Menus and Documents
    input: documents
    output: documents
    categories:
      - document
    rename: safe

content:
  - name: hours
    label: Restaurant Hours
    type: file
    path: content/site.json
    format: json
    fields:
      - name: monday
        label: Monday
        type: string

      - name: tuesday_thursday_lunch
        label: Tuesday–Thursday Lunch
        type: string

      - name: tuesday_thursday_dinner
        label: Tuesday–Thursday Dinner
        type: string

      - name: friday_saturday_lunch
        label: Friday–Saturday Lunch
        type: string

      - name: friday_saturday_dinner
        label: Friday–Saturday Dinner
        type: string

      - name: sunday_brunch
        label: Sunday Brunch
        type: string

      - name: sunday_dinner
        label: Sunday Dinner
        type: string

  - name: gallery
    label: Gallery Photos
    type: file
    path: content/gallery.json
    format: json
    list: true
    fields:
      - name: image
        label: Photograph
        type: image
        options:
          media: images
          categories:
            - image

      - name: alt
        label: Image Description
        type: string
        description: "Briefly describe the image for accessibility."

  - name: menus
    label: Restaurant Menus
    type: file
    path: content/menu.json
    format: json
    fields:
      - name: brunch
        label: Brunch Menu Pages
        type: image
        options:
          media: images
          multiple:
            max: 4
          unique: true
          categories:
            - image

      - name: lunch
        label: Lunch Menu Pages
        type: image
        options:
          media: images
          multiple:
            max: 4
          unique: true
          categories:
            - image

      - name: dinner
        label: Dinner Menu Pages
        type: image
        options:
          media: images
          multiple:
            max: 4
          unique: true
          categories:
            - image

      - name: desserts
        label: Dessert Menu Pages
        type: image
        options:
          media: images
          multiple:
            max: 4
          unique: true
          categories:
            - image

      - name: drinks
        label: Drink Menu Pages
        type: image
        options:
          media: images
          multiple:
            max: 4
          unique: true
          categories:
            - image

  - name: upcoming_events
    label: Upcoming Events
    type: file
    path: content/events.json
    format: json
    list: true
    fields:
      - name: published
        label: Show This Event
        type: boolean
        default: true

      - name: image
        label: Event Photograph
        type: image
        options:
          media: images
          categories:
            - image

      - name: alt
        label: Image Description
        type: string
        description: "Briefly describe the event image for accessibility."

      - name: date_label
        label: Date Heading
        type: string
        description: "Example: September 19–21, 2026"

      - name: title
        label: Event Name
        type: string

      - name: description
        label: Event Description
        type: text

      - name: date_time
        label: Date and Time Details
        type: string
        description: "Example: Saturday, September 19 from 5–10pm"

      - name: location
        label: Location
        type: string
        default: "Supergeil Detroit"

      - name: button_text
        label: Button Text
        type: string
        default: "Learn More"

      - name: button_url
        label: Button Link
        type: string
        required: false
        description: "Paste the reservation, ticket, or information link."
          
          
    - name: homepage_banner
    label: Homepage Banner
    type: file
    path: content/banner.json
    format: json
    fields:
      - name: enabled
        label: Show Banner
        type: boolean
        default: true

      - name: text
        label: Banner Message
        type: string

      - name: link
        label: Banner Link
        type: string
        description: "Use upcoming-events.html or paste a complete website link."